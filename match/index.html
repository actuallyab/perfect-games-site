<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfect Chase — You've Been Challenged!</title>
<meta name="description" content="Your friend challenged you to a cricket match in Perfect Chase. Open the app to accept!" />

<!-- Open Graph for WhatsApp/social previews -->
<meta property="og:type" content="website" />
<meta property="og:title" content="🏏 You've Been Challenged!" />
<meta property="og:description" content="Your friend wants to play a cricket match against you in Perfect Chase. Tap to accept the challenge!" />
<meta property="og:url" content="https://actuallyab.github.io/perfect-games-site/match/" />
<meta property="og:image" content="https://actuallyab.github.io/perfect-games-site/assets/og-image.png" />
<meta property="og:site_name" content="Perfect Chase" />

<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0E3D2A;
    color: #F5F0E1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 400px;
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(242,199,68,0.3);
    border-radius: 20px;
    padding: 40px 28px;
  }
  .emoji { font-size: 56px; margin-bottom: 16px; }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #F2C744;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 15px;
    opacity: 0.8;
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .cta {
    display: inline-block;
    background: #F2C744;
    color: #0A2A1D;
    font-size: 16px;
    font-weight: 700;
    padding: 14px 36px;
    border-radius: 14px;
    text-decoration: none;
    letter-spacing: 1px;
    box-shadow: 0 4px 16px rgba(242,199,68,0.3);
    transition: transform 0.15s;
  }
  .cta:active { transform: scale(0.97); }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    opacity: 0.5;
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid rgba(242,199,68,0.3);
    border-top-color: #F2C744;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .redirecting { font-size: 13px; opacity: 0.7; margin-top: 16px; }
</style>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var matchId = params.get('id') || '';
  var hostName = params.get('host') || 'Your friend';

  var playStoreUrl = 'https://play.google.com/store/apps/details?id=com.perfectgames.perfectchase'
    + '&referrer=' + encodeURIComponent(
        'utm_source=share'
      + '&utm_medium=multiplayer'
      + '&utm_campaign=challenge'
      + (matchId ? '&utm_content=' + matchId : '')
    );

  var isAndroid = /android/i.test(navigator.userAgent);

  if (isAndroid) {
    // Android with app installed: App Links will intercept this page load
    // before JS runs — user never sees this page at all.
    //
    // Android WITHOUT app: App Links verification fails silently,
    // page loads normally, and we redirect to Play Store after a short delay.
    // The delay gives App Links time to intercept if the app IS installed
    // but verification is slow (network latency on assetlinks.json check).
    setTimeout(function() {
      window.location.replace(playStoreUrl);
    }, 1500);
  }

  // Write the host name into the page once DOM is ready
  document.addEventListener('DOMContentLoaded', function() {
    var nameEl = document.getElementById('host-name');
    if (nameEl) nameEl.textContent = hostName;

    var ctaEl = document.getElementById('cta-link');
    if (ctaEl) ctaEl.href = playStoreUrl;

    // Show redirecting message on Android
    if (isAndroid) {
      var redir = document.getElementById('redirecting');
      if (redir) redir.style.display = 'block';
    }
  });
})();
</script>
</head>
<body>
<div class="card">
  <div class="emoji">🏏</div>
  <h1>YOU'VE BEEN CHALLENGED!</h1>
  <p class="subtitle">
    <strong id="host-name">Your friend</strong> wants to play a Full Match
    against you in Perfect Chase.
  </p>
  <a id="cta-link" class="cta" href="#">
    Accept Challenge →
  </a>
  <div id="redirecting" class="redirecting" style="display:none;">
    <span class="spinner"></span>Taking you to the Play Store…
  </div>
  <p class="footer">🏏 Perfect Chase</p>
</div>
</body>
</html>
